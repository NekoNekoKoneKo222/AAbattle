name: CHAOS SHOGI checks
on:
  push:
    branches: [feature/csh-mastery-awakening-rewards]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build workspace projects
        run: npm run build:shift
      - name: CHAOS SHOGI regression tests
        run: node --test test/chaos*.test.js
