name: Validate SHIFT character and credits changes
on:
  push:
    branches: [shift-admin-houkou-stage]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Unpack Houkou original textures and Blockbench files
        run: |
          mkdir -p shift-arena/apps/client/public/houkou
          unzip -o -q shift-arena/assets/houkou-source.zip -d shift-arena/apps/client/public/houkou
      - run: npm run build --workspace @shift/shared
      - run: npm run build --workspace @shift/client
      - run: npm run build --workspace @shift/server
      - run: npm run test --workspace @shift/shared
      - run: node --test test/shift*.test.js
