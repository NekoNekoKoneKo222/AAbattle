name: Validate admin recipient and Houkou model hotfix
on:
  push:
    branches: [shift-admin-name-model-fix]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build --workspace @shift/shared
      - name: Unpack supplied original Houkou model
        run: |
          mkdir -p shift-arena/apps/client/public/houkou
          unzip -o -q shift-arena/assets/houkou-source.zip -d shift-arena/apps/client/public/houkou
          unzip -o -q shift-arena/assets/houkou-user-model-exact.zip -d shift-arena/apps/client/public/houkou
          echo 'eb6998ff2e98c4ab18920a866dbc6b36a49f5006dc2dcf7dc63d36a3606c11f6  shift-arena/apps/client/public/houkou/houkou.json' | sha256sum -c -
      - run: npm run build --workspace @shift/client
      - run: npm run build --workspace @shift/server
      - run: npm run test --workspace @shift/shared
      - run: node --test test/shift*.test.js
