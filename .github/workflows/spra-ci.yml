name: SPRA checks

on:
  push:
    branches: [main]
    paths:
      - 'src/spra.js'
      - 'src/spra-ink.js'
      - 'src/spra-navigation.js'
      - 'src/spra-leaderboard.js'
      - 'test/spra-astergum.test.js'
      - 'test/spra-tutorial.test.js'
      - 'test/spra-ipad.test.js'
      - 'test/spra-progression.test.js'
      - 'test/spra-perf.test.js'
      - 'test/spra-stress.test.js'
      - 'test/spra-ink-queue.test.js'
      - 'test/spra-ink-bench.mjs'
      - 'public/spra/**'
      - 'test/spra.test.js'
      - 'src/server.js'
      - '.github/workflows/spra-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/spra.js'
      - 'src/spra-ink.js'
      - 'src/spra-navigation.js'
      - 'src/spra-leaderboard.js'
      - 'test/spra-astergum.test.js'
      - 'test/spra-tutorial.test.js'
      - 'test/spra-ipad.test.js'
      - 'test/spra-progression.test.js'
      - 'test/spra-perf.test.js'
      - 'test/spra-stress.test.js'
      - 'test/spra-ink-queue.test.js'
      - 'test/spra-ink-bench.mjs'
      - 'public/spra/**'
      - 'test/spra.test.js'
      - 'src/server.js'
      - '.github/workflows/spra-ci.yml'

permissions:
  contents: read

jobs:
  spra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Syntax checks
        run: |
          node --check src/spra.js
          node --check src/spra-navigation.js
          node --check src/spra-leaderboard.js
          node --check src/spra-ink.js
          node --check public/spra/game.js
          node --check public/spra/city.js
          node --check public/spra/weapons.js
          node --check public/spra/specials.js
          node --check public/spra/facilities.js
          node --check public/spra/cosmic-render.js
          node --check public/spra/tutorial.js
          node --check public/spra/touch-guard.js
          node --check public/spra/progression.js
          node --check src/server.js
      - name: SPRA PvP tests
        run: node --test test/spra.test.js test/spra-stress.test.js test/spra-astergum.test.js test/spra-progression.test.js test/spra-perf.test.js test/spra-ink-queue.test.js
      - name: Before/after ink performance and pixel equivalence
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:src/spra-ink.js > "$RUNNER_TEMP/spra-ink-baseline.mjs"
          node test/spra-ink-bench.mjs "$RUNNER_TEMP/spra-ink-baseline.mjs"
      - name: Install Chromium for visual regression
        run: npx playwright install chromium
      - name: SPRA browser visual regression
        run: node --test test/spra-browser.test.js test/spra-tutorial.test.js test/spra-ipad.test.js
