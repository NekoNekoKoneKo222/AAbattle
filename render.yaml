services:
  - type: web
    name: aabattle
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build:shift
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Neon PostgreSQL: enter the secret connection string on first deploy
      - key: AI_MODEL
        value: gpt-4.1-mini

