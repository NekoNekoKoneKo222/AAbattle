services:
  - type: web
    name: aabattle
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aabattle-db
          property: connectionString
      - key: AI_MODEL
        value: gpt-4.1-mini

databases:
  - name: aabattle-db
    region: singapore
    plan: free
    ipAllowList: []
